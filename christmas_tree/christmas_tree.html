<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; background-color: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));

const mainLight = new THREE.PointLight(0xffffff, 80);
mainLight.position.set(6, 6, 6);
scene.add(mainLight);

const treeGroup = new THREE.Group();
scene.add(treeGroup);

let treeTopY = -Infinity;

const leafCount = 9000;

for (let i = 0; i < leafCount; i++) {

    const y = Math.random() * 8 - 4;
    treeTopY = Math.max(treeTopY, y);

    let radius = (4 - y) * 0.48;
    radius *= 0.92 + Math.random() * 0.08;

    const angle = Math.random() * Math.PI * 2;

    const geo = new THREE.PlaneGeometry(
        0.35 + Math.random() * 0.15,
        0.45 + Math.random() * 0.25,
        3,
        5
    );

    const pos = geo.attributes.position;
    for (let j = 0; j < pos.count; j++) {
        const yy = pos.getY(j);
        pos.setZ(j, Math.sin(yy * 6 + Math.random() * 2) * 0.08);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0.05, 0.25 + Math.random() * 0.15, 0.05),
        roughness: 0.9,
        side: THREE.DoubleSide
    });

    const leaf = new THREE.Mesh(geo, mat);

    leaf.position.set(
        Math.cos(angle) * radius,
        y,
        Math.sin(angle) * radius
    );

    leaf.lookAt(leaf.position.x * 1.5, y - 0.3, leaf.position.z * 1.5);
    leaf.rotation.z += (Math.random() - 0.5) * Math.PI;

    const s = 0.7 + Math.random() * 0.6;
    leaf.scale.set(s, s, s);

    treeGroup.add(leaf);
}

for (let i = 0; i < 180; i++) {

    const h = Math.random() * 7.8 - 3.9;
    const t = (h + 4) / 8;
    const angle = Math.random() * Math.PI * 2;

    const r = (4 - h) * (0.48 + t * 0.11) * (1.03 + Math.random() * 0.05);

    const isSilver = Math.random() > 0.5;

    const mat = new THREE.MeshStandardMaterial({
    color: isSilver ? 0xf2f2f2 : 0xff1a1a,
    metalness: isSilver ? 0.6 : 0.7,
    roughness: isSilver ? 0.18 : 0.25,
    emissive: 0x000000,
});


    const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 20, 20),
        mat
    );

    ball.position.set(
        Math.cos(angle) * r,
        h,
        Math.sin(angle) * r
    );

    treeGroup.add(ball);
}

const fairyCount = 240;

for (let i = 0; i < fairyCount; i++) {

    const h = Math.random() * 7.8 - 3.8;
    const t = (h + 4) / 8;
    const angle = Math.random() * Math.PI * 2;

    const r = (4 - h) * (0.49 + t * 0.12) * (1.01 + Math.random() * 0.04);

    const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.065, 8, 8),
        new THREE.MeshBasicMaterial({
            color: 0xffd36a,
            transparent: true,
            opacity: 0.95
        })
    );

    dot.position.set(
        Math.cos(angle) * r,
        h,
        Math.sin(angle) * r
    );

    treeGroup.add(dot);
}

const starShape = new THREE.Shape();
for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 0.85 : 0.4;
    const a = (i / 10) * Math.PI * 2;
    i === 0
        ? starShape.moveTo(Math.cos(a) * r, Math.sin(a) * r)
        : starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
}

const star = new THREE.Mesh(
    new THREE.ExtrudeGeometry(starShape, { depth: 0.2, bevelEnabled: true }),
    new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.8,
        roughness: 0.25,
        emissive: 0xffb400,
        emissiveIntensity: 1.8
    })
);

star.position.y = treeTopY + 0.55;
treeGroup.add(star);

const starLight = new THREE.PointLight(0xffcc66, 40, 10);
starLight.position.set(0, star.position.y, 0);
scene.add(starLight);

const snowCanvas = document.createElement("canvas");
snowCanvas.width = snowCanvas.height = 128;
const ctx = snowCanvas.getContext("2d");

ctx.clearRect(0, 0, 128, 128);
ctx.translate(64, 64);
ctx.strokeStyle = "white";
ctx.lineWidth = 6;
ctx.lineCap = "round";

function drawArm() {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -40);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(-10, -30);
    ctx.moveTo(0, -20);
    ctx.lineTo(10, -30);
    ctx.stroke();
}

for (let i = 0; i < 6; i++) {
    drawArm();
    ctx.rotate(Math.PI / 3);
}

const snowTexture = new THREE.CanvasTexture(snowCanvas);
snowTexture.anisotropy = 4;

const snowCount = 1800;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(snowCount * 3);

for (let i = 0; i < snowPos.length; i++) {
    snowPos[i] = (Math.random() - 0.5) * 30;
}

snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));

const snowMaterial = new THREE.PointsMaterial({
    size: 0.35,
    map: snowTexture,
    alphaMap: snowTexture,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    sizeAttenuation: true
});

const snow = new THREE.Points(snowGeo, snowMaterial);
scene.add(snow);


function animate() {
    requestAnimationFrame(animate);

    treeGroup.rotation.y += 0.005;

    const p = snow.geometry.attributes.position.array;
    for (let i = 1; i < p.length; i += 3) {
        p[i] -= 0.04;
        if (p[i] < -12) p[i] = 12;
    }
    snow.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
